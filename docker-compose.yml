# Phase 5 deployment compose file — not used for local dev (see README: dev runs
# the backend via uvicorn and the frontend via `npm run dev` directly on the host).
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - db-data:/data/db
      - photo-data:/data/photos
      # PaddleOCR downloads its detection/recognition models on first use and
      # caches them under the container user's home dir — without this volume
      # they'd re-download on every container recreation.
      - paddle-models:/root/.paddlex
      # Shared with `backup` (see infra/backup/run.sh) — this is how the
      # "run backup now" button reaches the backup container, which has no
      # other channel to the backend (no shared network trigger, no Docker
      # socket access).
      - backup-trigger:/data/backup-trigger
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"

  backup:
    build: ./infra/backup
    restart: unless-stopped
    env_file: .env
    volumes:
      - db-data:/data/db:ro
      - photo-data:/data/photos:ro
      - backup-data:/data/backups
      - backup-trigger:/data/backup-trigger
      - ./infra/rclone/rclone.conf:/root/.config/rclone/rclone.conf:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # 443 isn't mapped by default — bare-IP deploys have no TLS cert to serve
      # (and Caddy would otherwise fail to start if the port is already taken,
      # e.g. by an existing VPN service on this host). Re-add "443:443" here
      # once a real domain is set up — see docs/DEPLOY.md.
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    depends_on:
      - backend
      - frontend

volumes:
  db-data:
  photo-data:
  paddle-models:
  backup-data:
  backup-trigger:
  caddy-data:
