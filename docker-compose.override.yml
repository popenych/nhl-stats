# Local-dev overrides for docker-compose.yml (Phase 5 — not used for Phase 0-4
# dev, which runs the backend via `uvicorn` and the frontend via `npm run dev`
# directly on the host). Exposes ports on localhost and mounts source for hot reload.
services:
  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    ports:
      - "5173:80"
